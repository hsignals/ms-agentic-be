# Local development resources only. Disposable tests use their own containers and ports.
services:
  postgres:
    image: timescale/timescaledb:2.24.0-pg17
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic_local
      POSTGRES_DB: agentic
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD" psql --host 127.0.0.1
          --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"
          --no-password --set ON_ERROR_STOP=1 --command "SELECT 1"
      interval: 2s
      timeout: 3s
      retries: 30
  valkey:
    image: valkey/valkey:8.1.6-alpine
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres:
  valkey:
